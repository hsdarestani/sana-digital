name: Import existing Sana brand asset
on:
  push:
    paths:
      - .github/workflows/import-sana-logo.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-brand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy approved Sana logo from existing Sana MVZ project
        run: |
          mkdir -p public/assets
          curl --fail --location --silent --show-error \
            'https://raw.githubusercontent.com/hsdarestani/sana-mvz/main/public/assets/sana-logo.png' \
            -o public/assets/sana-logo.png
          file public/assets/sana-logo.png
          test "$(wc -c < public/assets/sana-logo.png)" -gt 1000
      - name: Commit approved brand asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/sana-logo.png
          if ! git diff --cached --quiet; then
            git commit -m "Reuse approved Sana logo locally"
            git push
          fi
